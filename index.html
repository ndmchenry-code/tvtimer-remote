<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看電視計時遙控</title>
<meta name="theme-color" content="#11161d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="電視計時">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%2311161d'/%3E%3Ccircle cx='54' cy='58' r='32' fill='none' stroke='%23ffb300' stroke-width='8'/%3E%3Cpath d='M51 40h6v18h14v6H51z' fill='%23ffb300'/%3E%3Cpath d='M46 14h16v8H46z' fill='%23ffb300'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, the remaining time is the hero; controls sit under the thumb. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --surface-2: #e9ebe6;
  --fg: #1a1f26;
  --muted: #5d6672;
  --line: #d6d9d2;
  --accent: #c27c00;
  --accent-fg: #ffffff;
  --accent-soft: #fff1d1;
  --go: #2e7d32;
  --stop: #c62828;
  --stop-soft: #fde4e2;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-digits: "Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #1b222c; --surface-2: #252e3a; --fg: #eef1f4; --muted: #9aa5b3;
    --line: #2f3946; --accent: #ffb300; --accent-fg: #1a1300; --accent-soft: #3a2c08;
    --go: #43a047; --stop: #ef5350; --stop-soft: #3b1d1d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #1b222c; --surface-2: #252e3a; --fg: #eef1f4; --muted: #9aa5b3;
  --line: #2f3946; --accent: #ffb300; --accent-fg: #1a1300; --accent-soft: #3a2c08;
  --go: #43a047; --stop: #ef5350; --stop-soft: #3b1d1d; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; }
[hidden] { display: none !important; }

header { display: flex; align-items: center; gap: 10px; padding-block: 14px 2px; }
header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .02em; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--go); }
.dot.bad { background: var(--stop); }
.link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; padding: 6px; cursor: pointer; }

.hero { background: var(--surface); border-radius: 20px; padding: 20px; display: grid; gap: 6px; }
.hero .who { color: var(--muted); font-size: 15px; }
.clock {
  font-family: var(--font-digits); font-weight: 700; font-variant-numeric: tabular-nums;
  font-size: clamp(56px, 20vw, 84px); line-height: 1; letter-spacing: -.02em;
}
.clock.idle { font-family: var(--font-body); font-size: 26px; font-weight: 700; letter-spacing: 0; line-height: 1.3; }
.clock.warn { color: var(--stop); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.paused { background: var(--accent-soft); color: var(--accent); }

.card { background: var(--surface); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.card h2 { font-size: 14px; color: var(--muted); font-weight: 500; margin: 0; letter-spacing: .04em; }
.pending { background: var(--accent-soft); }
.pending p { margin: 0; font-weight: 700; }

.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.row.two { grid-template-columns: 1fr 1fr; }
button.b {
  font: 500 17px/1 var(--font-body); min-height: 52px; border-radius: 14px; border: 0;
  background: var(--surface-2); color: var(--fg); cursor: pointer; padding: 0 12px;
  touch-action: manipulation;
}
button.b:active { transform: scale(.98); }
button.b:focus-visible, .toggle:focus-within, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.b.primary { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
button.b.go { background: var(--go); color: #fff; font-weight: 700; }
button.b.danger { background: var(--stop-soft); color: var(--stop); font-weight: 700; }
button.b.danger.armed { background: var(--stop); color: #fff; }
button.b:disabled { opacity: .45; cursor: default; }
.digits { font-family: var(--font-digits); font-variant-numeric: tabular-nums; }

.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { position: relative; }
.toggle input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.toggle span {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px;
  background: var(--surface-2); font-weight: 500;
}
.toggle input:checked + span { background: var(--accent); color: var(--accent-fg); }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: center; }
.stepper output { text-align: center; font-family: var(--font-digits); font-size: 22px; font-weight: 700; }

.kids { display: grid; gap: 8px; }
.kid { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding-block: 4px; border-bottom: 1px solid var(--line); }
.kid:last-child { border-bottom: 0; }
.kid b { font-size: 17px; }
.kid small { color: var(--muted); font-size: 13px; display: block; text-align: right; }
.kid .digits { font-size: 17px; text-align: right; }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }

form { display: grid; gap: 12px; }
label.f { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
label.f input {
  font: 16px var(--font-body); padding: 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); min-width: 0; width: 100%;
}
.note { font-size: 13px; color: var(--muted); margin: 0; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px;
  max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / .2);
}
@media (prefers-reduced-motion: reduce) { button.b:active { transform: none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="dot" id="dot" title="連線狀態"></span>
    <h1>看電視計時</h1>
    <button class="link" id="openSetup" type="button">設定</button>
  </header>

  <!-- 第一次使用：輸入主題 -->
  <section class="card" id="setup" hidden>
    <h2>連線設定</h2>
    <p class="note">主題名稱在電腦的 config/ntfy.properties。只會存在這支手機的瀏覽器裡。</p>
    <form id="setupForm">
      <label class="f">通知主題（ntfy.statusTopic）<input id="fStatus" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <label class="f">指令主題（ntfy.cmdTopic）<input id="fCmd" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <label class="f">伺服器<input id="fServer" value="https://ntfy.sh" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
      <label class="f">Access token（沒有就留空）<input id="fToken" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <div class="row two">
        <button class="b" type="button" id="cancelSetup">取消</button>
        <button class="b primary" type="submit">儲存</button>
      </div>
    </form>
  </section>

  <div id="app" hidden>
    <section class="hero" aria-live="polite">
      <div class="who" id="who">正在讀取電視狀態…</div>
      <div class="clock idle" id="clock">—</div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="card pending" id="pendingCard" hidden>
      <p id="pendingText"></p>
      <div class="row two">
        <button class="b danger" type="button" id="deny">拒絕</button>
        <button class="b go" type="button" id="approve">同意</button>
      </div>
    </section>

    <section class="card" id="controls" hidden>
      <div class="row">
        <button class="b digits" type="button" data-cmd="add:-15">−15</button>
        <button class="b digits" type="button" data-cmd="add:15">+15</button>
        <button class="b digits" type="button" data-cmd="add:30">+30</button>
      </div>
      <div class="row two">
        <button class="b" type="button" id="pause">暫停</button>
        <button class="b danger" type="button" id="stop">現在結束</button>
      </div>
    </section>

    <section class="card" id="startCard" hidden>
      <h2>開始計時</h2>
      <div class="toggles" id="kidToggles"></div>
      <div class="toggles" id="presets"></div>
      <div class="stepper">
        <button class="b digits" type="button" id="minus">−</button>
        <output id="minutes" for="minus plus">30 分</output>
        <button class="b digits" type="button" id="plus">+</button>
      </div>
      <div class="row two">
        <button class="b" type="button" id="startUnlimited">不限制</button>
        <button class="b primary" type="button" id="start">開始</button>
      </div>
    </section>

    <section class="card">
      <h2>今天</h2>
      <div class="kids" id="kids"></div>
    </section>

    <div class="foot">
      <span id="lastSeen">尚未收到電視回報</span>
      <button class="link" type="button" id="refresh">重新整理</button>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const STORE = "tvtimer-remote";
  const DEFAULT_KIDS = [{ id: "yulie", name: "Yulie" }, { id: "jill", name: "Jill" }];
  const PRESETS = [15, 30, 45, 60];

  let cfg = load();
  let snap = null;          // 最新的電視狀態快照
  let snapAt = 0;           // 快照在 ntfy 上的發佈時間（毫秒）
  let source = null;        // EventSource
  let minutes = 30;
  let picked = new Set();
  let waitTimer = 0;
  let stopArmedUntil = 0;

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE)) || null; } catch { return null; }
  }
  function save(c) {
    try { localStorage.setItem(STORE, JSON.stringify(c)); } catch { /* 私密瀏覽：只在這次開啟有效 */ }
  }

  const base = () => cfg.server.replace(/\/+$/, "");
  const stateTopic = () => cfg.status + "-state";
  const authHeaders = () => (cfg.token ? { Authorization: "Bearer " + cfg.token } : {});
  const authQuery = () => cfg.token
    ? "auth=" + btoa("Bearer " + cfg.token).replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_")
    : "";

  // ---------- 連線 ----------
  async function fetchLatest() {
    try {
      const q = ["poll=1", "since=12h", authQuery()].filter(Boolean).join("&");
      const res = await fetch(`${base()}/${encodeURIComponent(stateTopic())}/json?${q}`, { headers: authHeaders() });
      if (!res.ok) throw new Error(res.status);
      const lines = (await res.text()).trim().split("\n").filter(Boolean);
      for (const line of lines) accept(JSON.parse(line));
      if (!snap || Date.now() - snapAt > 10 * 60 * 1000) send("sync", { quiet: true });
    } catch {
      setDot("bad");
    }
  }

  function connect() {
    if (source) source.close();
    const q = authQuery();
    source = new EventSource(`${base()}/${encodeURIComponent(stateTopic())}/sse${q ? "?" + q : ""}`);
    source.onopen = () => setDot("ok");
    source.onerror = () => setDot("bad");
    source.onmessage = (e) => { try { accept(JSON.parse(e.data)); } catch { /* 忽略壞資料 */ } };
  }

  function accept(msg) {
    if (msg.event && msg.event !== "message") return;
    let data;
    try { data = JSON.parse(msg.message); } catch { return; }
    const at = (msg.time || 0) * 1000;
    if (at < snapAt) return;
    snap = data;
    snapAt = at;
    clearTimeout(waitTimer);
    render();
  }

  async function send(cmd, { quiet = false } = {}) {
    try {
      const res = await fetch(`${base()}/${encodeURIComponent(cfg.cmd)}`, { method: "POST", body: cmd, headers: authHeaders() });
      if (!res.ok) throw new Error(res.status);
      if (quiet) return;
      toast("已送出，等電視回應…");
      clearTimeout(waitTimer);
      waitTimer = setTimeout(() => toast("電視沒有回應，可能已關機或沒網路"), 12000);
    } catch {
      toast("送不出去，請檢查手機網路或連線設定");
    }
  }

  // ---------- 畫面 ----------
  const seconds = () => (Date.now() - snapAt) / 1000;

  /** 用快照時間推算目前的剩餘與已看秒數（電視只在狀態改變時才回報） */
  function live() {
    const s = snap.session;
    const d = s && !s.paused ? Math.max(0, seconds()) : 0;
    const counted = s && !s.unlimited ? Math.min(d, s.remainingSeconds) : d;
    const session = s && {
      ...s,
      remaining: s.unlimited ? 0 : Math.max(0, s.remainingSeconds - d),
      elapsed: s.elapsedSeconds + counted,
    };
    const kids = (snap.kids || DEFAULT_KIDS).map((k) => ({
      ...k,
      used: (k.usedSeconds || 0) + (s && s.kidIds.includes(k.id) ? counted : 0),
    }));
    return { session, kids };
  }

  const names = (ids) => ids.map((id) => (snap.kids || DEFAULT_KIDS).find((k) => k.id === id)?.name || id).join("、");
  const mmss = (sec) => {
    const t = Math.ceil(sec);
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    const pad = (n) => String(n).padStart(2, "0");
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  };

  function render() {
    if (!snap) return;
    const { session, kids } = live();
    const clock = $("clock"), chips = $("chips");
    chips.textContent = "";
    if (session) {
      $("who").textContent = `${names(session.kidIds)} 正在看`;
      clock.className = "clock";
      if (session.unlimited) {
        clock.textContent = mmss(session.elapsed);
        addChip("不限制 · 已看時間");
      } else {
        clock.textContent = mmss(session.remaining);
        clock.classList.toggle("warn", session.remaining <= 300);
        if (session.remaining <= 0) addChip("時間到");
      }
      if (session.paused) addChip("已暫停", "paused");
    } else {
      $("who").textContent = "目前";
      clock.className = "clock idle";
      clock.textContent = "沒有人在看電視";
    }
    if (!snap.guard) addChip("防護已關閉");

    $("controls").hidden = !session;
    $("startCard").hidden = !!session;
    if (session) {
      $("pause").textContent = session.paused ? "繼續" : "暫停";
      document.querySelectorAll("[data-cmd^='add:']").forEach((b) => (b.disabled = session.unlimited));
    }

    const p = snap.pending;
    $("pendingCard").hidden = !p;
    if (p) $("pendingText").textContent = `${names(p.kidIds)} 想要不限制時間看電視`;

    renderKidToggles();
    $("kids").replaceChildren(...kids.map((k) => {
      const row = document.createElement("div");
      row.className = "kid";
      const left = document.createElement("b");
      left.textContent = k.name;
      const right = document.createElement("div");
      const used = document.createElement("div");
      used.className = "digits";
      used.textContent = `已看 ${Math.floor(k.used / 60)} 分`;
      right.append(used);
      if (k.leftoverSeconds) {
        const small = document.createElement("small");
        small.textContent = `可接續 ${Math.ceil(k.leftoverSeconds / 60)} 分`;
        right.append(small);
      }
      row.append(left, right);
      return row;
    }));

    const ago = Math.floor(seconds() / 60);
    const when = new Date(snapAt).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
    $("lastSeen").textContent = `電視回報於 ${when}${ago >= 1 ? `（${ago} 分鐘前）` : ""}`;
  }

  function addChip(text, cls) {
    const c = document.createElement("span");
    c.className = "chip" + (cls ? " " + cls : "");
    c.textContent = text;
    $("chips").append(c);
  }

  function renderKidToggles() {
    const kids = snap?.kids || DEFAULT_KIDS;
    const box = $("kidToggles");
    if (box.dataset.ids === kids.map((k) => k.id).join()) return;
    box.dataset.ids = kids.map((k) => k.id).join();
    box.replaceChildren(...kids.map((k) => toggle("kid-" + k.id, k.name, picked.has(k.id), (on) => {
      on ? picked.add(k.id) : picked.delete(k.id);
    })));
  }

  function toggle(id, text, checked, onChange, type = "checkbox", name) {
    const label = document.createElement("label");
    label.className = "toggle";
    const input = document.createElement("input");
    input.type = type; input.id = id; input.checked = checked;
    if (name) input.name = name;
    input.addEventListener("change", () => onChange(input.checked));
    const span = document.createElement("span");
    span.textContent = text;
    label.append(input, span);
    return label;
  }

  function renderPresets() {
    $("presets").replaceChildren(...PRESETS.map((m) => toggle("preset-" + m, `${m} 分`, m === minutes, () => setMinutes(m), "radio", "preset")));
  }
  function setMinutes(m) {
    minutes = Math.min(240, Math.max(5, m));
    $("minutes").textContent = `${minutes} 分`;
    document.querySelectorAll("input[name=preset]").forEach((r) => (r.checked = Number(r.id.slice(7)) === minutes));
  }

  let toastTimer = 0;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 3500);
  }
  function setDot(state) { $("dot").className = "dot " + state; }

  // ---------- 操作 ----------
  document.querySelectorAll("[data-cmd]").forEach((b) => b.addEventListener("click", () => send(b.dataset.cmd)));
  $("pause").addEventListener("click", () => send(snap?.session?.paused ? "resume" : "pause"));
  $("stop").addEventListener("click", () => {
    const b = $("stop");
    if (Date.now() < stopArmedUntil) {
      stopArmedUntil = 0;
      b.classList.remove("armed");
      b.textContent = "現在結束";
      send("stop");
      return;
    }
    stopArmedUntil = Date.now() + 4000;
    b.classList.add("armed");
    b.textContent = "再按一次確認";
    setTimeout(() => { if (Date.now() >= stopArmedUntil) { b.classList.remove("armed"); b.textContent = "現在結束"; } }, 4100);
  });
  $("approve").addEventListener("click", () => snap?.pending && send("approve:" + snap.pending.id));
  $("deny").addEventListener("click", () => snap?.pending && send("deny:" + snap.pending.id));
  $("minus").addEventListener("click", () => setMinutes(minutes - 5));
  $("plus").addEventListener("click", () => setMinutes(minutes + 5));
  $("start").addEventListener("click", () => {
    if (!picked.size) return toast("請先選擇誰要看");
    send(`start:${[...picked].join("+")}:${minutes}`);
  });
  $("startUnlimited").addEventListener("click", () => {
    if (!picked.size) return toast("請先選擇誰要看");
    send(`unlimited:${[...picked].join("+")}`);
  });
  $("refresh").addEventListener("click", () => { send("sync", { quiet: true }); fetchLatest(); toast("已請電視回報狀態"); });

  // ---------- 設定 ----------
  function showSetup(show) {
    $("setup").hidden = !show;
    $("app").hidden = show;
    $("cancelSetup").hidden = !cfg;
    if (show && cfg) {
      $("fStatus").value = cfg.status; $("fCmd").value = cfg.cmd;
      $("fServer").value = cfg.server; $("fToken").value = cfg.token || "";
    }
  }
  $("openSetup").addEventListener("click", () => showSetup(true));
  $("cancelSetup").addEventListener("click", () => showSetup(false));
  $("setupForm").addEventListener("submit", (e) => {
    e.preventDefault();
    cfg = {
      status: $("fStatus").value.trim(),
      cmd: $("fCmd").value.trim(),
      server: $("fServer").value.trim() || "https://ntfy.sh",
      token: $("fToken").value.trim(),
    };
    save(cfg);
    snap = null; snapAt = 0;
    showSetup(false);
    start();
  });

  function start() {
    $("who").textContent = "正在讀取電視狀態…";
    fetchLatest();
    connect();
  }

  document.addEventListener("visibilitychange", () => { if (!document.hidden && cfg) fetchLatest(); });
  setInterval(render, 1000);
  renderPresets();
  setMinutes(30);

  if (cfg) { showSetup(false); start(); } else { showSetup(true); }
})();
</script>
</body>
</html>
